openapi: 3.0.3

info:
  title: API de Produtos
  version: 1.0.0
  description: API REST desenvolvida com Java 21, Javalin, JDBC e H2, com controle de estoque.

servers:
  - url: http://localhost:7000

tags:
  - name: Produtos
    description: Operações de gerenciamento de produtos
  - name: Estoque
    description: Movimentações e consulta de estoque

paths:
  /produtos:
    get:
      tags: [Produtos]
      summary: Listar todos os produtos
      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Produto'
    post:
      tags: [Produtos]
      summary: Cadastrar um produto com estoque inicial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoEntrada'
      responses:
        '201':
          description: Produto cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          description: Dados inválidos

  /produtos/{id}:
    parameters:
      - $ref: '#/components/parameters/ProdutoId'
    get:
      tags: [Produtos]
      summary: Buscar produto por ID
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '404':
          description: Produto não encontrado
    put:
      tags: [Produtos]
      summary: Atualizar nome e preço de um produto, preservando o estoque atual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoEntrada'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          description: Dados inválidos
        '404':
          description: Produto não encontrado
    delete:
      tags: [Produtos]
      summary: Excluir um produto
      responses:
        '204':
          description: Produto excluído
        '404':
          description: Produto não encontrado

  /produtos/{id}/estoque/entrada:
    parameters:
      - $ref: '#/components/parameters/ProdutoId'
    post:
      tags: [Estoque]
      summary: Registrar entrada de unidades no estoque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovimentacaoEstoque'
      responses:
        '200':
          description: Entrada registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          description: Quantidade inválida ou limite máximo excedido
        '404':
          description: Produto não encontrado

  /produtos/{id}/estoque/saida:
    parameters:
      - $ref: '#/components/parameters/ProdutoId'
    post:
      tags: [Estoque]
      summary: Registrar saída de unidades do estoque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovimentacaoEstoque'
      responses:
        '200':
          description: Saída registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          description: Quantidade inválida ou estoque insuficiente
        '404':
          description: Produto não encontrado

  /produtos/estoque-baixo:
    get:
      tags: [Estoque]
      summary: Listar produtos com estoque menor ou igual ao limite informado
      parameters:
        - name: limite
          in: query
          required: true
          description: Quantidade máxima para considerar o estoque baixo
          schema:
            type: integer
            minimum: 0
            example: 5
      responses:
        '200':
          description: Produtos dentro do limite informado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Produto'
        '400':
          description: Limite ausente ou inválido

components:
  parameters:
    ProdutoId:
      name: id
      in: path
      required: true
      description: Identificador do produto
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    ProdutoEntrada:
      type: object
      required: [nome, preco]
      properties:
        nome:
          type: string
          example: Notebook
        preco:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          example: 3500.00
        quantidadeEstoque:
          type: integer
          minimum: 0
          default: 0
          example: 25
          description: Estoque inicial do produto. Se omitido, será zero.
    MovimentacaoEstoque:
      type: object
      required: [quantidade]
      properties:
        quantidade:
          type: integer
          minimum: 1
          example: 10
    Produto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: Notebook
        preco:
          type: number
          format: double
          example: 3500.00
        quantidadeEstoque:
          type: integer
          minimum: 0
          example: 25
